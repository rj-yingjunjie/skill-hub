name: Generate Marketplace

on:
  push:
    branches: [main]
    paths: ['catalog.json']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate marketplace.json from catalog
        run: |
          node -e "
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('catalog.json', 'utf-8'));
          const mpPath = '.claude-plugin/marketplace.json';
          const existing = JSON.parse(fs.readFileSync(mpPath, 'utf-8'));

          // Build plugin entries from catalog (type=plugin)
          const catalogPlugins = catalog.skills
            .filter(s => s.type === 'plugin')
            .map(entry => ({
              name: entry.name,
              source: './' + entry.subpath
            }));

          // Always keep 'common' plugin
          const hasCommon = catalogPlugins.some(p => p.name === 'common');
          if (!hasCommon) {
            catalogPlugins.unshift({ name: 'common', source: './plugins/common' });
          }

          existing.plugins = catalogPlugins;
          fs.writeFileSync(mpPath, JSON.stringify(existing, null, 2) + '\n');
          console.log('Generated marketplace.json with ' + existing.plugins.length + ' plugins');
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git diff --staged --quiet || (git commit -m "chore: auto-generate marketplace.json" && git push)
